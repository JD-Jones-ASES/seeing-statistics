name: Build & deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Assembly-only deps. The notebooks are committed pre-executed, so CI never
      # re-runs them (no kernel/statsmodels needed) — it only re-exports HTML and
      # builds the JupyterLite app, explorables, social card, and search index.
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nbconvert nbformat numpy pandas scipy matplotlib \
                      jupyterlite-core jupyterlite-pyodide-kernel jupyter-server

      - name: Build the static site
        run: python tools/build_site.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: rendered

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
